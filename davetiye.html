<!DOCTYPE html>
<html lang="tr" data-root="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fuar Davetiyesi Oluştur — Giresun EXPO</title>
  <script>
  /* Adres uzantısız ve sondaki eğik çizgi olmadan açılırsa göreli yollar
     bozulur. Normalize et. */
  (function () {
    var y = location.pathname;
    if (!/\/$/.test(y) && !/\.[a-z0-9]+$/i.test(y)) {
      location.replace(y + '/' + location.search + location.hash);
    }
  })();
  </script>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="icon" href="assets/img/brand/favicon-32.png" sizes="32x32">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/config.js"></script>
  <style>
    .dv-duzen { display: grid; gap: var(--space-7); align-items: start; }
    @media (min-width: 900px) { .dv-duzen { grid-template-columns: 23rem 1fr; } }
    .dv-onizleme {
      background-color: var(--color-surface-alt, #F4F7F5);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex; justify-content: center;
    }
    .dv-onizleme canvas {
      width: 100%; max-width: 460px; height: auto; display: block;
      box-shadow: var(--shadow-md, 0 10px 30px rgba(0,0,0,.12));
      background-color: #fff;
    }
    .dv-ozet {
      margin-top: var(--space-4); padding: var(--space-4);
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      background-color: var(--color-surface-alt, #F4F7F5);
      font-size: .9375rem; line-height: 1.6;
    }
    .dv-ozet dt { font-weight: 600; color: var(--color-muted); font-size: .8125rem; }
    .dv-ozet dd { margin: 0 0 var(--space-3); }
    .dv-ozet dd:last-child { margin-bottom: 0; }
    .dv-uyari { color: #8A4B00; }

    /* İndirme butonu asıl eylem: geniş ve ortalı, mobilde parmakla rahat basılır */
    .dv-eylem {
      display: grid; gap: var(--space-3); justify-items: center;
      margin-top: var(--space-5);
    }
    .dv-eylem #dv-indir { justify-content: center; max-width: 24rem; }
    .dv-durum { text-align: center; }

    .dv-olcek { width: 100%; accent-color: var(--color-primary); height: 1.75rem; }
    .dv-olcek-deger {
      float: right; font-variant-numeric: tabular-nums; color: var(--color-primary);
    }

    /* Mobilde araları sıkıştır: bir alanı değiştirince önizleme
       ekrandan uzağa kaçmasın. */
    @media (max-width: 899.98px) {
      .page-header { padding-block: var(--space-5) var(--space-4); }
      .page-header h1 { font-size: 1.75rem; margin-bottom: var(--space-2); }
      .page-header .lead { font-size: .9375rem; line-height: 1.5; }
      .section--compact { padding-block: var(--space-4); }
      .dv-duzen { gap: var(--space-4); }
      #dv-form { gap: var(--space-3); }
      .form__group { gap: .25rem; }
      .form__hint { font-size: .8125rem; line-height: 1.4; }
      .dv-eylem { margin-top: var(--space-3); gap: var(--space-2); }
      .dv-onizleme { padding: var(--space-3); }
      .dv-onizleme canvas { max-width: 232px; }
      .dv-ozet { margin-top: var(--space-3); padding: var(--space-3); }

      /* Önizleme yukarı alınır ve yapışkan durur: alanları değiştirirken
         davetiye hep ekranda kalır, aşağı yukarı kaydırmak gerekmez. */
      .dv-duzen { display: flex; flex-direction: column; align-items: stretch; }
      .dv-duzen > div:last-child {
        order: -1;
        position: sticky;
        top: calc(var(--header-h, 84px) - 24px);   /* yapışkan başlığın altına */
        z-index: 5;
        background-color: var(--color-bg, #fff);
        padding-bottom: var(--space-2);
      }
      /* Özet masaüstünde kalsın; mobilde yer kaplamasın (bilgi zaten
         davetiyenin üzerinde görünüyor). */
      .dv-ozet { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>

  <header class="site-header">
    <div class="container header__inner">
      <a class="logo" href="index.html" aria-label="Giresun EXPO — ana sayfa">
        <img src="assets/img/brand/giresun-expo-logo-tarihsiz.png" alt="Giresun EXPO" width="600" height="242">
      </a>
    </div>
  </header>

  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Fuar Davetiyesi Oluştur</h1>
        <p class="lead">Katılımcı firmalarımız, müşterileri ve iş ortakları için kişiye özel
          dijital davetiyelerini buradan oluşturabilir. Giresun Expo 2026’da verimli, keyifli
          ve bol iş birlikleriyle dolu bir fuar geçirmenizi dileriz.</p>
      </div>
    </section>

    <section class="section section--compact">
      <div class="container dv-duzen">
        <form class="form" id="dv-form" novalidate>

          <div class="form__group">
            <label class="form__label" for="dv-firma">Katılımcı firma</label>
            <select class="form__control" id="dv-firma">
              <option value="">Yükleniyor…</option>
            </select>
          </div>

          <div class="form__group">
            <label class="form__label" for="dv-ad">Davet edilen kişi</label>
            <input class="form__control" id="dv-ad" type="text" maxlength="60"
                   placeholder="Ad Soyad" autocomplete="off" spellcheck="false">
          </div>

          <div class="form__group">
            <label class="form__label" for="dv-stant">Stant numarası</label>
            <input class="form__control" id="dv-stant" type="text" maxlength="30"
                   placeholder="Firma seçince dolar" autocomplete="off" spellcheck="false">
          </div>

          <div class="form__group" id="dv-olcek-grup" hidden>
            <label class="form__label" for="dv-olcek">
              Logo boyutu <span class="dv-olcek-deger" id="dv-olcek-deger">%100</span>
            </label>
            <input class="dv-olcek" id="dv-olcek" type="range" min="50" max="200" step="5" value="100">
          </div>

          <div class="dv-eylem">
            <button class="btn btn--primary btn--lg btn--block" type="button" id="dv-indir">
              Davetiye Görselini İndir
            </button>
            <button class="btn btn--ghost" type="button" id="dv-temizle">Alanları temizle</button>
          </div>
          <p class="form__hint dv-durum" id="dv-durum" role="status" aria-live="polite"></p>
        </form>

        <div>
          <div class="dv-onizleme">
            <canvas id="dv-tuval" width="975" height="1463" aria-label="Davetiye önizlemesi"></canvas>
          </div>
          <dl class="dv-ozet" id="dv-ozet" hidden>
            <dt>Firma</dt><dd id="dv-o-firma">—</dd>
            <dt>Logo</dt><dd id="dv-o-logo">—</dd>
          </dl>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
  import { katilimcilar } from './assets/js/data.js';
  import { getClient } from './assets/js/supabase-client.js';

  /* Şablon ölçüleri — 975×1463 px görselin kendi koordinatları ------------ */
  const SABLON = 'assets/img/davetiye/davet-sablon-2026.jpg';
  const EN = 975, BOY = 1463, OLCEK = 2;

  /* Üzeri boyanıp yeniden yazılan üç alan */
  /* Kutular şablondaki yuvarlak köşeli kutularla birebir örtüşmeli; düz
     dikdörtgen boyanırsa köşelerde çıkıntı kalıyor. */
  const ISIM  = { x: 79, y: 593, en: 438, boy: 65, r: 8, zemin: '#E7EBF6', renk: '#0E2E61',
                  solPay: 26, punto: 34, enAz: 19 };
  const STANT = { x: 589, y: 1211, en: 213, boy: 76, r: 9, zemin: '#003366', renk: '#FFFFFF',
                  punto: 40, enAz: 18 };
  const LOGO  = { silX: 82, silY: 1196, silEn: 424, silBoy: 104, zemin: '#FDFDFD',
                  ortaX: 292, ortaY: 1248, maxEn: 320, maxBoy: 74,
                  /* kayar çubuk büyütse bile hücreden taşmasın */
                  sinirEn: 414, sinirBoy: 96,
                  yaziPunto: 26, yaziEnAz: 15, yaziRenk: '#0E2E61' };

  const tuval  = document.getElementById('dv-tuval');
  const ctx    = tuval.getContext('2d');
  const secim  = document.getElementById('dv-firma');
  const adGiris    = document.getElementById('dv-ad');
  const stantGiris = document.getElementById('dv-stant');
  const durum  = document.getElementById('dv-durum');
  const olcek      = document.getElementById('dv-olcek');
  const olcekGrup  = document.getElementById('dv-olcek-grup');
  const olcekDeger = document.getElementById('dv-olcek-deger');
  const ozet   = document.getElementById('dv-ozet');
  const oFirma = document.getElementById('dv-o-firma');
  const oLogo  = document.getElementById('dv-o-logo');

  tuval.width = EN * OLCEK;
  tuval.height = BOY * OLCEK;

  let sablonHazir = false;
  let logoGorsel = null;          // seçili firmanın yüklenmiş logosu
  let firmalar = [];

  const sablon = new Image();
  sablon.onload = () => { sablonHazir = true; durum.textContent = ''; ciz(); };
  sablon.onerror = () => { durum.textContent = 'Davetiye şablonu yüklenemedi.'; };
  durum.textContent = 'Şablon yükleniyor…';
  sablon.src = SABLON;

  /* Yazı tipleri hazır olunca yeniden çiz */
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('600 34px Poppins', 'Mehmet Fatih Kacır'),
      document.fonts.load('700 40px Poppins', 'P1-19')
    ]).then(() => { if (sablonHazir) ciz(); }).catch(() => {});
  }

  /* --- Firma listesi ---------------------------------------------------- */

  function logoAdresi(yol) {
    if (!yol) return '';
    if (/^https?:\/\//i.test(yol)) return yol;
    if (yol.startsWith('assets/')) return new URL(yol, document.baseURI).href;
    const c = window.GE_CONFIG || {};
    return c.SUPABASE_URL
      ? `${c.SUPABASE_URL.replace(/\/$/, '')}/storage/v1/object/public/public-media/${yol}`
      : '';
  }

  function standMetni(ex) {
    const s = Array.isArray(ex.stands) ? ex.stands
            : String(ex.stands || '').split(/[,;]\s*/).filter(Boolean);
    return s.join(' / ');
  }

  const trSirala = (a, b) => a.name.localeCompare(b.name, 'tr');

  (async function firmalariYukle() {
    const sonuc = await katilimcilar();
    firmalar = (sonuc.veri || []).slice().sort(trSirala);
    secim.innerHTML = '';
    const bos = document.createElement('option');
    bos.value = ''; bos.textContent = 'Firma seçin…';
    secim.appendChild(bos);
    firmalar.forEach((ex, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      const st = standMetni(ex);
      o.textContent = st ? `${ex.name} — ${st}` : ex.name;
      secim.appendChild(o);
    });
  })();

  secim.addEventListener('change', async () => {
    const ex = firmalar[Number(secim.value)];
    logoGorsel = null;
    if (!ex) { stantGiris.value = ''; ozet.hidden = true; olcekGrup.hidden = true; ciz(); return; }

    stantGiris.value = standMetni(ex);
    ozet.hidden = false;
    oFirma.textContent = ex.name;

    const url = logoAdresi(ex.logo_url || ex.logo);
    if (!url) {
      oLogo.innerHTML = '<span class="dv-uyari">Logo yok — firma adı yazıyla basılacak.</span>';
      olcekGrup.hidden = true;
      ciz();
      return;
    }
    oLogo.textContent = 'Yükleniyor…';
    try {
      logoGorsel = await gorselYukle(url);
      oLogo.textContent = 'Logo kullanılıyor.';
      olcekGrup.hidden = false;
    } catch {
      logoGorsel = null;
      olcekGrup.hidden = true;
      oLogo.innerHTML = '<span class="dv-uyari">Logo açılamadı — firma adı yazıyla basılacak.</span>';
    }
    ciz();
  });

  function gorselYukle(src) {
    return new Promise((tamam, hata) => {
      const g = new Image();
      g.crossOrigin = 'anonymous';
      g.onload = () => tamam(g);
      g.onerror = () => hata(new Error('yüklenemedi'));
      g.src = src;
    });
  }

  /* --- Çizim ------------------------------------------------------------ */

  function yaziTipi(agirlik, punto) {
    return `${agirlik} ${punto}px Poppins, system-ui, sans-serif`;
  }

  /** Yuvarlak köşeli dolu dikdörtgen (roundRect desteklenmeyen tarayıcıda elle) */
  function yuvarlakKutu(x, y, en, boy, r, renk) {
    ctx.fillStyle = renk;
    ctx.beginPath();
    if (typeof ctx.roundRect === 'function') {
      ctx.roundRect(x, y, en, boy, r);
    } else {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + en, y, x + en, y + boy, r);
      ctx.arcTo(x + en, y + boy, x, y + boy, r);
      ctx.arcTo(x, y + boy, x, y, r);
      ctx.arcTo(x, y, x + en, y, r);
      ctx.closePath();
    }
    ctx.fill();
  }

  /** Metni verilen genişliğe sığdıran punto */
  function sigdir(metin, punto, enAz, maxEn, agirlik) {
    let p = punto;
    while (p > enAz) {
      ctx.font = yaziTipi(agirlik, p);
      if (ctx.measureText(metin).width <= maxEn) break;
      p -= 0.5;
    }
    ctx.font = yaziTipi(agirlik, p);
    return p;
  }

  /** Metni iki satıra böler (kelime sınırında) */
  function ikiSatir(metin, maxEn) {
    const kelimeler = String(metin).split(/\s+/);
    let ilk = '', ikinci = '';
    for (const k of kelimeler) {
      const deneme = ilk ? `${ilk} ${k}` : k;
      if (ctx.measureText(deneme).width <= maxEn || !ilk) ilk = deneme;
      else ikinci = ikinci ? `${ikinci} ${k}` : k;
    }
    return ikinci ? [ilk, ikinci] : [ilk];
  }

  function ciz() {
    if (!sablonHazir) return;
    const ad = adGiris.value.trim();
    const stant = stantGiris.value.trim();
    const ex = firmalar[Number(secim.value)];

    ctx.setTransform(OLCEK, 0, 0, OLCEK, 0, 0);
    ctx.clearRect(0, 0, EN, BOY);
    ctx.drawImage(sablon, 0, 0, EN, BOY);

    /* 1) İsim — şablondaki ismi zeminle kapat, yenisini yaz */
    yuvarlakKutu(ISIM.x, ISIM.y, ISIM.en, ISIM.boy, ISIM.r, ISIM.zemin);
    if (ad) {
      sigdir(ad, ISIM.punto, ISIM.enAz, ISIM.en - ISIM.solPay * 2, 600);
      ctx.fillStyle = ISIM.renk;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(ad, ISIM.x + ISIM.solPay, ISIM.y + ISIM.boy / 2 + 1);
    }

    /* 2) Logo hücresi — eski logoyu kapat */
    ctx.fillStyle = LOGO.zemin;
    ctx.fillRect(LOGO.silX, LOGO.silY, LOGO.silEn, LOGO.silBoy);
    if (logoGorsel) {
      const k = Number(olcek.value || 100) / 100;
      /* Önce hücreye sığdır, sonra kaydırıcıyla ölçekle, sonra sınırla kırp */
      const temel = Math.min(LOGO.maxEn / logoGorsel.naturalWidth,
                             LOGO.maxBoy / logoGorsel.naturalHeight);
      const kirp = Math.min(LOGO.sinirEn / logoGorsel.naturalWidth,
                            LOGO.sinirBoy / logoGorsel.naturalHeight);
      const o = Math.min(temel * k, kirp);
      const w = logoGorsel.naturalWidth * o, h = logoGorsel.naturalHeight * o;
      ctx.drawImage(logoGorsel, LOGO.ortaX - w / 2, LOGO.ortaY - h / 2, w, h);
      /* Hücreye sığan en büyük orana gelindiyse yüzdeyi olduğu gibi göster */
      const enBuyuk = Math.round((kirp / temel) * 100);
      olcekDeger.textContent = k * 100 >= enBuyuk ? `%${enBuyuk} (en büyük)` : `%${olcek.value}`;
    } else if (ex) {
      ctx.fillStyle = LOGO.yaziRenk;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let p = sigdir(ex.name, LOGO.yaziPunto, LOGO.yaziEnAz, LOGO.maxEn, 600);
      if (ctx.measureText(ex.name).width > LOGO.maxEn) {
        p = 20; ctx.font = yaziTipi(600, p);
        const satir = ikiSatir(ex.name, LOGO.maxEn);
        ctx.fillText(satir[0], LOGO.ortaX, LOGO.ortaY - 13);
        if (satir[1]) ctx.fillText(satir[1], LOGO.ortaX, LOGO.ortaY + 13);
      } else {
        ctx.fillText(ex.name, LOGO.ortaX, LOGO.ortaY);
      }
    }

    /* 3) Stant numarası — lacivert kutuyu boyayıp yeniden yaz */
    yuvarlakKutu(STANT.x, STANT.y, STANT.en, STANT.boy, STANT.r, STANT.zemin);
    if (stant) {
      sigdir(stant, STANT.punto, STANT.enAz, STANT.en - 28, 700);
      ctx.fillStyle = STANT.renk;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(stant, STANT.x + STANT.en / 2, STANT.y + STANT.boy / 2 + 1);
    }
  }

  /* --- Etkileşim -------------------------------------------------------- */

  olcek.addEventListener('input', () => {
    olcekDeger.textContent = `%${olcek.value}`;
    ciz();   /* sınıra gelinmişse ciz() yüzdeyi düzeltir */
  });

  let zaman = null;
  const gecikmeliCiz = () => { clearTimeout(zaman); zaman = setTimeout(ciz, 120); };
  adGiris.addEventListener('input', gecikmeliCiz);
  stantGiris.addEventListener('input', gecikmeliCiz);

  document.getElementById('dv-temizle').addEventListener('click', () => {
    adGiris.value = ''; stantGiris.value = ''; secim.value = '';
    logoGorsel = null; ozet.hidden = true;
    olcekGrup.hidden = true; olcek.value = '100'; olcekDeger.textContent = '%100';
    ciz(); secim.focus();
  });

  function slug(t) {
    return String(t || 'davetiye').toLocaleLowerCase('tr')
      .replace(/ı/g, 'i').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ş/g, 's')
      .replace(/ö/g, 'o').replace(/ç/g, 'c')
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'davetiye';
  }

  /** data: URL -> Blob (senkron; paylaşım için dokunma hareketi korunur) */
  function dataUrlBlob(dataUrl) {
    const [bas, veri] = dataUrl.split(',');
    const tur = (bas.match(/:(.*?);/) || [, 'image/png'])[1];
    const ham = atob(veri);
    const dizi = new Uint8Array(ham.length);
    for (let i = 0; i < ham.length; i++) dizi[i] = ham.charCodeAt(i);
    return new Blob([dizi], { type: tur });
  }

  /** İndirme sayacı — admin panelindeki Pano okur. Sessizdir: kayıt
      yazılamazsa (Supabase yok, ağ hatası) kullanıcı hiçbir şey fark etmez. */
  function sayacaYaz(ex, cihaz, yontem) {
    getClient()
      .then((sb) => sb && sb.rpc('davetiye_indirildi', {
        p_slug: ex ? ex.slug : null, p_cihaz: cihaz, p_yontem: yontem
      }))
      .then((r) => { if (r && r.error) console.warn('[GE] Davetiye sayacı:', r.error.message); })
      .catch(() => {});
  }

  function indir(blob, dosyaAdi) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = dosyaAdi;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    durum.textContent = 'Davetiye indirildi.';
  }

  document.getElementById('dv-indir').addEventListener('click', () => {
    if (!sablonHazir) { durum.textContent = 'Şablon henüz yüklenmedi, biraz bekleyin.'; return; }
    ciz();

    const ex = firmalar[Number(secim.value)];
    const kisalt = (t) => t.slice(0, 28).replace(/-+$/, '');
    const parca = [kisalt(slug(adGiris.value)), ex ? kisalt(slug(ex.name)) : '']
      .filter(Boolean).join('-');
    const dosyaAdi = `giresun-expo-davetiye-${parca || 'davetiye'}.png`;

    /* toDataURL senkron: aynı dokunma hareketi içinde kaldığımız için
       iOS ve Android paylaşım penceresini engellemez. */
    let blob;
    try { blob = dataUrlBlob(tuval.toDataURL('image/png')); }
    catch { durum.textContent = 'Görsel oluşturulamadı.'; return; }

    /* Telefonda paylaşım penceresi: oradan "Fotoğraflara kaydet" ile
       davetiye doğrudan galeriye gider. Masaüstü Safari/Chrome da dosya
       paylaşımını desteklediği için yalnızca dokunmatik cihazlarda açılır;
       bilgisayarda ve desteklenmeyen yerde normal indirme. */
    const dokunmatik = (navigator.userAgentData && navigator.userAgentData.mobile) ||
      (window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches);
    const cihaz = dokunmatik ? 'mobil' : 'masaustu';
    const dosya = (dokunmatik && typeof File === 'function') ? new File([blob], dosyaAdi, { type: 'image/png' }) : null;
    if (dosya && navigator.canShare && navigator.canShare({ files: [dosya] })) {
      durum.textContent = 'Paylaşım penceresi açılıyor…';
      navigator.share({ files: [dosya], title: 'Giresun EXPO 2026 Davetiyesi' })
        .then(() => {
          durum.textContent = 'Davetiye kaydedildi.';
          sayacaYaz(ex, cihaz, 'paylasim');
        })
        .catch((e) => {
          if (e && e.name === 'AbortError') { durum.textContent = ''; return; }   // vazgeçti: sayılmaz
          indir(blob, dosyaAdi);   // paylaşım başarısızsa indirmeye düş
          sayacaYaz(ex, cihaz, 'indirme');
        });
      return;
