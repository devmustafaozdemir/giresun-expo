<!doctype html>
<html lang="tr" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parola Yenile — Giresun EXPO Yönetim</title>
<meta name="robots" content="noindex, nofollow">
<script>document.documentElement.classList.add('js')</script>
<link rel="icon" href="../assets/img/brand/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="giris">

<main class="giris__kart" id="main">

  <img class="giris__logo" src="../assets/img/brand/giresun-expo-logo-tarihsiz.png"
       alt="Giresun EXPO" width="168" height="56">

  <h1 class="giris__baslik">Yeni Parola</h1>
  <p class="giris__alt">Hesabınız için yeni bir parola belirleyin.</p>

  <form id="yenile-formu" novalidate>

    <div class="giris__alan form__group">
      <label class="form__label" for="sifre1">Yeni parola</label>
      <div class="sifre-sarmal">
        <input class="form__control" id="sifre1" name="password" type="password"
               required autocomplete="new-password" minlength="8" maxlength="200" autofocus>
        <button class="sifre-goster" type="button" id="sifre-goster"
                aria-label="Parolaları göster" aria-pressed="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <p class="form__hint">En az 8 karakter.</p>
    </div>

    <div class="giris__alan form__group">
      <label class="form__label" for="sifre2">Yeni parola (tekrar)</label>
      <input class="form__control" id="sifre2" name="password_confirm" type="password"
             required autocomplete="new-password" minlength="8" maxlength="200">
    </div>

    <div class="giris__eylem">
      <button class="btn btn--primary" type="submit" id="yenile-btn">Parolayı Değiştir</button>
    </div>

  </form>

  <div id="mesaj" role="alert" aria-live="assertive" hidden></div>

  <p class="giris__yardim" id="geri-don" hidden>
    <a href="index.html">Giriş sayfasına dön</a>
  </p>

  <noscript>
    <p class="giris__hata" style="margin-top:var(--space-4)">
      Parola yenileme JavaScript olmadan çalışamaz. Lütfen tarayıcınızda etkinleştirin.
    </p>
  </noscript>

</main>

<script src="../assets/js/config.js"></script>
<script type="module" src="../assets/js/admin/sifre-yenile.js"></script>

</body>
</html>
