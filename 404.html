<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sayfa bulunamadı — Giresun EXPO 2026</title>

  <!-- Bu sayfanın stili KASITLI olarak gömülüdür.
       GitHub Pages özel 404'ü her derinlikteki bilinmeyen adres için sunar
       (/giresun-expo/en/olmayan-sayfa gibi). Göreli bir stylesheet yolu o
       durumda çözümlenemez ve sayfa stilsiz görünürdü. Aynı sebeple burada
       logo ve font dosyası da kullanılmaz. Bkz. CLAUDE.md -> 404 tuzağı.

       AYNI SEBEPLE: aşağıdaki bağlantılar sitenin tek kök-göreli yollarıdır.
       Göreli yol her derinlikte yanlış hedefe giderdi. Özel alan adına
       geçilirse (/giresun-expo/ kalkarsa) BU YOLLAR GÜNCELLENMELİDİR. -->
  <style>
    :root {
      --primary: #005E44; --primary-dark: #00432F; --secondary: #184181;
      --ink: #12211B; --muted: #5C6B63; --surface: #F4F7F4; --border: #DCE4DE;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
      background: var(--surface); color: #38453E;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      line-height: 1.65; text-align: center;
    }
    .wrap { max-width: 34rem; }
    .code {
      display: block; margin-bottom: 1rem;
      color: var(--secondary); font-size: 4rem; font-weight: 700; line-height: 1;
      letter-spacing: -0.03em; font-variant-numeric: tabular-nums;
    }
    h1 { margin: 0 0 .75rem; color: var(--primary); font-size: 1.75rem; line-height: 1.2; }
    h1::after {
      content: ""; display: block; width: 56px; height: 3px; margin: 1rem auto 0;
      background: var(--secondary); border-radius: 999px;
    }
    p { margin: 1.25rem 0 0; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 2rem; }
    a.btn {
      display: inline-flex; align-items: center; padding: .75rem 1.5rem;
      border: 1px solid transparent; border-radius: 10px;
      font-size: .9375rem; font-weight: 600; text-decoration: none;
    }
    .btn--primary { background: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-dark); }
    .btn--secondary { border-color: var(--primary); color: var(--primary); }
    .btn--secondary:hover { background: #E6F0EC; }
    .en { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); font-size: .9375rem; }
    a { color: var(--primary); }
    :focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="wrap">
    <span class="code" aria-hidden="true">404</span>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bağlantı taşınmış veya adres yanlış yazılmış olabilir.
      Aşağıdaki bağlantılardan devam edebilirsiniz.</p>

    <div class="actions">
      <a class="btn btn--primary" href="/giresun-expo/">Ana sayfa</a>
      <a class="btn btn--secondary" href="/giresun-expo/katilimcilar.html">Katılımcılar</a>
      <a class="btn btn--secondary" href="/giresun-expo/iletisim.html">İletişim</a>
    </div>

    <p class="en" lang="en">
      <strong>Page not found.</strong> The link may have moved or the address may be
      mistyped. <a href="/giresun-expo/en/">Go to the English home page</a>.
    </p>
  </main>
</body>
</html>
